<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TBBR Firmware</title>
<link rel="icon" href="ui/icon.svg" type="image/svg+xml">
<style>
@font-face { font-family: Inter; font-weight: 400; src: url(ui/fonts/Inter-400.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 500 700; src: url(ui/fonts/Inter-700.ttf) format('truetype'); }
@font-face { font-family: Inter; font-weight: 800 900; src: url(ui/fonts/Inter-800.ttf) format('truetype'); }
:root {
  --bg: #08090b; --bg2: #0d0f12; --panel: #121418; --panel2: #171a1f; --panel3: #1d2127;
  --line: #22262d; --line2: #2d323a; --tx: #eceef1; --tx2: #9ba3ad; --tx3: #5f6772;
  --acc: #19d3ff; --acc2: #0aa6cc; --ok: #3ddc84; --warn: #ffb020; --bad: #ff4d4d;
  --mono: 'JetBrains Mono', Consolas, ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--tx); }
body { font: 13px/1.4 Inter, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:disabled { opacity: .35; cursor: default; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #2a2f37; border-radius: 8px; }

/* barre du haut (comme l'app) */
.topbar { height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: linear-gradient(#14171b, #0e1013); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; }
.brand-mark { width: 28px; height: 28px; fill: none; stroke: var(--acc); stroke-width: 2; }
.brand-txt { font-weight: 800; letter-spacing: .14em; font-size: 12px; color: var(--tx2); }
.brand-txt b { color: var(--tx); font-weight: 800; }
.top-title { padding-left: 14px; margin-left: 4px; border-left: 1px solid var(--line2); font-weight: 700; font-size: 13px; color: var(--tx2); letter-spacing: .02em; }
.spacer { flex: 1; }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: #0a0b0e; border: 1px solid var(--line2); }
.seg button { height: 26px; padding: 0 10px; border-radius: 6px; font-size: 11.5px; font-weight: 700; color: var(--tx2); }
.seg button.on { background: var(--panel3); color: var(--acc); box-shadow: 0 0 0 1px var(--line2); }

main { flex: 1; min-height: 0; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.wrap { width: min(1080px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.btn { height: 36px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 9px; background: var(--panel3); border: 1px solid var(--line2); color: var(--tx); font-weight: 600; white-space: nowrap; transition: background .15s, border-color .15s, filter .15s; }
.btn:hover:not(:disabled) { background: #252a31; border-color: #3a414b; }
.btn.primary { background: var(--acc); border-color: var(--acc); color: #001a22; font-weight: 700; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.1); background: var(--acc); }
.btn.danger { background: rgba(255, 77, 77, .12); border-color: rgba(255, 77, 77, .4); color: #ff8a8a; }
.btn.danger:hover:not(:disabled) { background: rgba(255, 77, 77, .2); }
.btn.ghost { background: none; border-color: transparent; color: var(--tx2); }
.btn.ghost:hover:not(:disabled) { background: var(--panel3); color: var(--tx); }
.btn.big { height: 44px; padding: 0 20px; font-size: 14px; border-radius: 11px; }
.btn .ic { width: 16px; height: 16px; }

.card { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h3 { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--tx3); display: flex; align-items: center; gap: 8px; }
.card h3 .num { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--panel3); border: 1px solid var(--line2); color: var(--tx2); font-size: 10.5px; letter-spacing: 0; }
.card p { color: var(--tx2); font-size: 12.5px; }
.chip { height: 26px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: 13px; background: var(--panel2); border: 1px solid var(--line2); font-size: 11.5px; font-weight: 600; color: var(--tx2); white-space: nowrap; }
.chip b { color: var(--tx); font-weight: 700; }
.chip.acc { color: var(--acc); border-color: rgba(25, 211, 255, .45); background: rgba(25, 211, 255, .08); }
.chip.ok { color: var(--ok); border-color: rgba(61, 220, 132, .45); background: rgba(61, 220, 132, .08); }
.chip.warn { color: var(--warn); border-color: rgba(255, 176, 32, .45); background: rgba(255, 176, 32, .08); }
.chip.bad { color: #ff8a8a; border-color: rgba(255, 77, 77, .45); background: rgba(255, 77, 77, .08); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }

/* carte pédale */
.hero { flex-direction: row; align-items: center; gap: 20px; padding: 18px 20px; }
.pedal { width: 176px; height: 170px; flex: none; position: relative; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .55)); }
.pedal svg { width: 100%; height: 100%; }
.pedal .led { transition: fill .3s, filter .3s; }
.hero-b { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.hero-t { font-size: 20px; font-weight: 800; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tx3); flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
.dot.acc { background: var(--acc); box-shadow: 0 0 10px var(--acc); }
.dot.bad { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
.dot.search { background: var(--warn); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.hero-s { color: var(--tx2); font-size: 12.5px; }
.hero-a { display: flex; flex-direction: column; gap: 8px; align-items: stretch; flex: none; }

.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 880px) { .steps { grid-template-columns: 1fr; } .hero { flex-wrap: wrap; } }
.step { justify-content: space-between; }
.step.main { border-color: rgba(25, 211, 255, .35); background: linear-gradient(180deg, rgba(25, 211, 255, .07), var(--panel) 60%); }
.step.main h3 .num { background: var(--acc); color: #001a22; border-color: var(--acc); }
.step-body { display: flex; flex-direction: column; gap: 10px; }
.step-act { display: flex; gap: 8px; flex-wrap: wrap; }
.step-act .btn { flex: 1; }
.kv { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 10px; background: #0a0b0e; border: 1px solid var(--line2); min-width: 0; }
.kv .k { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--tx3); }
.kv .v { font-size: 12px; color: var(--tx); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.kv .v.ltr { direction: ltr; }
.note { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--tx2); }
.note .ic { width: 15px; height: 15px; color: var(--ok); margin-top: 1px; }
.note.w .ic { color: var(--warn); }

.pkg { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--line2); background: #0a0b0e; font-size: 12px; color: var(--tx2); cursor: pointer; transition: border-color .15s, background .15s; }
.pkg:hover { border-color: #3a414b; }
.pkg .ic { width: 18px; height: 18px; color: var(--acc); }
.pkg b { color: var(--tx); }
.pkg span { flex: 1; min-width: 0; }
.pkg.loaded { border-style: solid; border-color: rgba(25, 211, 255, .45); background: rgba(25, 211, 255, .06); cursor: default; }
.drop { position: fixed; inset: 10px; z-index: 150; border: 2px dashed var(--acc); border-radius: 18px; background: rgba(8, 9, 11, .85); display: none; place-items: center; font-size: 18px; font-weight: 800; color: var(--acc); pointer-events: none; }
.drop.on { display: grid; }

/* progression */
.prog { display: none; }
.prog.on { display: flex; }
.prog-h { display: flex; align-items: center; gap: 12px; }
.prog-h h2 { font-size: 15px; font-weight: 800; flex: 1; }
.pct { font: 700 22px var(--mono); color: var(--acc); }
.bar { height: 10px; border-radius: 6px; background: #0a0b0e; border: 1px solid var(--line2); overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--acc2), var(--acc)); box-shadow: 0 0 14px rgba(25, 211, 255, .6); border-radius: 6px; transition: width .35s; }
.bar.indet i { width: 30% !important; animation: indet 1.2s ease-in-out infinite; }
@keyframes indet { 0% { left: -30%; } 100% { left: 100%; } }
.bar.ok i { background: var(--ok); box-shadow: 0 0 14px rgba(61, 220, 132, .6); }
.bar.bad i { background: var(--bad); box-shadow: none; }
.phases { display: flex; gap: 6px; flex-wrap: wrap; }
.ph { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border-radius: 14px; border: 1px solid var(--line2); color: var(--tx3); font-size: 11.5px; font-weight: 600; }
.ph .d { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.ph.done { color: var(--ok); border-color: rgba(61, 220, 132, .35); }
.ph.cur { color: var(--acc); border-color: rgba(25, 211, 255, .5); background: rgba(25, 211, 255, .08); }
.ph.cur .d { animation: blink .9s infinite; }
.ph.fail { color: #ff8a8a; border-color: rgba(255, 77, 77, .5); }
.prog-line { font: 12px var(--mono); color: var(--tx2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result { display: none; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; font-weight: 600; }
.result.ok { display: flex; background: rgba(61, 220, 132, .08); border: 1px solid rgba(61, 220, 132, .4); color: #9ff0c1; }
.result.bad { display: flex; background: rgba(255, 77, 77, .08); border: 1px solid rgba(255, 77, 77, .45); color: #ffb3b3; }
.result .ic { width: 22px; height: 22px; }
.result span { flex: 1; white-space: pre-wrap; user-select: text; }
.warnbar { display: none; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: rgba(255, 176, 32, .08); border: 1px solid rgba(255, 176, 32, .4); color: #ffd08a; font-weight: 600; font-size: 12.5px; }
.warnbar.on { display: flex; }

/* journal */
details.log { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
details.log summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--tx3); }
details.log summary::-webkit-details-marker { display: none; }
details.log summary .ic { width: 14px; height: 14px; transition: transform .15s; }
details.log[open] summary .ic { transform: rotate(90deg); }
details.log summary .btn { margin-left: auto; height: 26px; font-size: 11px; letter-spacing: 0; text-transform: none; }
pre#log { margin: 0; max-height: 240px; min-height: 120px; overflow: auto; padding: 12px 16px; background: #07080a; border-top: 1px solid var(--line); font: 11.5px/1.5 var(--mono); color: #c9d1d9; white-space: pre-wrap; word-break: break-all; user-select: text; }
footer { flex: none; padding: 10px 18px; border-top: 1px solid var(--line); color: var(--tx3); font-size: 11.5px; display: flex; gap: 12px; }
footer .spacer { flex: 1; }

/* modale (comme l'app) */
.modal-bg { position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, .66); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 16px; animation: fade .15s; }
.modal { width: min(520px, 100%); display: flex; flex-direction: column; background: var(--panel2); border: 1px solid var(--line2); border-radius: 16px; box-shadow: 0 30px 80px rgba(0, 0, 0, .7); overflow: hidden; animation: pop .18s cubic-bezier(.2, .9, .3, 1.2); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.modal-h h3 { flex: 1; font-size: 15px; font-weight: 700; }
.modal-h .ic { color: var(--acc); }
.modal-h.w .ic { color: var(--warn); }
.modal-b { padding: 16px; display: flex; flex-direction: column; gap: 10px; color: var(--tx2); font-size: 13px; }
.modal-b .path { font: 12px var(--mono); color: var(--tx); background: #0a0b0e; border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; word-break: break-all; user-select: text; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: scale(.96); opacity: 0; } }
.toasts { position: fixed; bottom: 54px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 200; pointer-events: none; }
.toast { padding: 10px 16px; border-radius: 10px; background: #1f242b; border: 1px solid var(--line2); box-shadow: 0 10px 30px rgba(0, 0, 0, .6); font-weight: 600; font-size: 12.5px; animation: pop .2s; }
.toast.err { border-color: rgba(255, 77, 77, .6); color: #ffb3b3; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></symbol>
  <symbol id="i-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></symbol>
</svg>

<header class="topbar">
  <div class="brand" title="The Big Black Rig">
    <svg viewBox="0 0 32 32" class="brand-mark"><rect x="2" y="7" width="28" height="18" rx="4"/><circle cx="10" cy="19" r="3"/><circle cx="22" cy="19" r="3"/><path d="M7 12h18"/></svg>
    <span class="brand-txt">BIG<b>BLACK</b>RIG</span>
  </div>
  <div class="top-title" data-t="Gestionnaire de firmware|Firmware manager"></div>
  <div class="spacer"></div>
  <div class="seg" id="lang"><button data-l="fr">FR</button><button data-l="en">EN</button></div>
</header>

<main><div class="wrap">
  <section class="card hero">
    <div class="pedal">
      <!-- M-VAVE BlackBox vue de dessus, cotes en mm (113 x 109), d'après la façade simulée de l'app (ecran.css) -->
      <svg viewBox="-1 -1 115 111">
        <defs>
          <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2d32"/><stop offset=".55" stop-color="#1b1d21"/><stop offset="1" stop-color="#141619"/></linearGradient>
          <linearGradient id="gKey" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3c4047"/><stop offset="1" stop-color="#25282d"/></linearGradient>
          <radialGradient id="gFs" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#eef0f2"/><stop offset=".45" stop-color="#a3a9b1"/><stop offset=".75" stop-color="#5b616a"/><stop offset="1" stop-color="#30343a"/></radialGradient>
        </defs>
        <rect x="0" y="0" width="113" height="109" rx="6" fill="url(#gBody)" stroke="#353a42" stroke-width=".5"/>
        <text x="6" y="7.4" font-size="2.4" font-weight="800" letter-spacing=".6" fill="#8a929c">BLACKBOX</text>
        <g><circle cx="19" cy="25" r="7.5" fill="#24272c" stroke="#17191d" stroke-width="1.2"/><rect x="18.6" y="19" width=".8" height="3.2" rx=".3" fill="#e8eaed"/>
          <text x="19" y="37" font-size="2" font-weight="700" text-anchor="middle" fill="#9aa2ac" font-family="Consolas, monospace">MASTER</text></g>
        <g><circle cx="94" cy="25" r="7.5" fill="#24272c" stroke="#17191d" stroke-width="1.2"/><rect x="93.6" y="19" width=".8" height="3.2" rx=".3" fill="#e8eaed"/>
          <text x="94" y="37" font-size="2" font-weight="700" text-anchor="middle" fill="#9aa2ac" font-family="Consolas, monospace">PARA</text></g>
        <rect x="40.15" y="9" width="32.7" height="32.7" rx="2" fill="#000" stroke="#2c3139" stroke-width=".4"/>
        <rect x="42.65" y="11.5" width="27.7" height="27.7" id="scr" fill="#0b0d10"/>
        <g id="scrLogo" fill="none" stroke="#19d3ff" stroke-width="1" opacity="0"><rect x="49.5" y="18.5" width="14" height="9" rx="2"/><circle cx="53.5" cy="24.5" r="1.5"/><circle cx="59.5" cy="24.5" r="1.5"/><path d="M51 21.5h11"/>
          <text x="56.5" y="33" font-size="2.2" font-weight="800" text-anchor="middle" fill="#eceef1" stroke="none" letter-spacing=".3">TBBR</text></g>
        <g id="keys" font-family="Consolas, monospace" font-size="1.9" font-weight="700" text-anchor="middle"></g>
        <circle class="led" cx="22" cy="69.1" r="1.1" fill="#2a2f37" stroke="#000" stroke-width=".2"/>
        <circle class="led" cx="91" cy="69.1" r="1.1" fill="#2a2f37" stroke="#000" stroke-width=".2"/>
        <g stroke="#0b0c0e" stroke-width=".8" fill="url(#gFs)"><circle cx="22" cy="81" r="7.6"/><circle cx="91" cy="81" r="7.6"/></g>
        <g stroke="#4a5058" stroke-width=".25"><path d="M33 81h14.5M65.5 81H80"/></g>
        <text x="56.5" y="81.7" font-size="1.9" font-weight="700" text-anchor="middle" fill="#8a929c" letter-spacing=".25" font-family="Consolas, monospace">TUNER</text>
      </svg>
    </div>
    <div class="hero-b">
      <div class="hero-t"><span class="dot search" id="devDot"></span><span id="devTitle"></span></div>
      <div class="hero-s" id="devSub"></div>
      <div class="chips" id="devChips"></div>
    </div>
    <div class="hero-a">
      <button class="btn" id="bDetect"><svg class="ic"><use href="#i-refresh"/></svg><span data-t="Détecter|Detect"></span></button>
    </div>
  </section>

  <div class="warnbar" id="busyWarn"><svg class="ic"><use href="#i-warn"/></svg><span id="busyTxt"></span></div>

  <section class="card prog" id="prog">
    <div class="prog-h"><h2 id="progTitle"></h2><span class="pct" id="pct"></span></div>
    <div class="bar" id="bar"><i id="barI"></i></div>
    <div class="phases" id="phases"></div>
    <div class="prog-line" id="progLine"></div>
    <div class="result" id="result"><svg class="ic"><use href="#i-check"/></svg><span id="resultTxt"></span><button class="btn ghost" id="bDismiss" data-t="Fermer|Close"></button></div>
  </section>

  <div class="steps">
    <section class="card step">
      <div class="step-body">
        <h3><span class="num">1</span><span data-t="Sauvegarde|Backup"></span></h3>
        <p data-t="Copie complète de la flash (1 Mio), lue deux fois et comparée. C'est le filet de sécurité pour revenir au firmware M-VAVE.|Full flash copy (1 MiB), read twice and compared. It is the safety net to return to the M-VAVE firmware."></p>
        <div class="kv"><span class="k" data-t="Sauvegarde utilisée|Backup in use"></span><span class="v" id="bkPath">—</span></div>
        <div class="chips" id="bkChips"></div>
      </div>
      <div class="step-act">
        <button class="btn" id="bChooseBk"><svg class="ic"><use href="#i-folder"/></svg><span data-t="Choisir…|Choose…"></span></button>
        <button class="btn" id="bBackup"><svg class="ic"><use href="#i-save"/></svg><span data-t="Sauvegarder|Back up"></span></button>
      </div>
    </section>

    <section class="card step main">
      <div class="step-body">
        <h3><span class="num">2</span><span id="instHead"></span></h3>
        <p id="instText"></p>
        <div class="note"><svg class="ic"><use href="#i-shield"/></svg><span data-t="Presets, IR et captures NAM conservés. Bootloader jamais touché.|Presets, IRs and NAM captures are kept. Bootloader never touched."></span></div>
        <div class="note"><svg class="ic"><use href="#i-check"/></svg><span data-t="Chaque secteur est relu et vérifié après écriture.|Every sector is read back and verified after writing."></span></div>
        <div class="pkg" id="pkgBox"></div>
      </div>
      <div class="step-act"><button class="btn primary big" id="bInstall"><svg class="ic"><use href="#i-chip"/></svg><span id="instBtn"></span></button></div>
    </section>

    <section class="card step">
      <div class="step-body">
        <h3><span class="num">3</span><span data-t="Restaurer l'origine|Restore original"></span></h3>
        <p data-t="Réécrit toute la flash depuis la sauvegarde (hors bootloader) : retour au firmware M-VAVE. Les presets, IR et captures TBBR sont remplacés.|Rewrites the whole flash from the backup (bootloader excluded): back to the M-VAVE firmware. TBBR presets, IRs and captures are replaced."></p>
        <div class="chips" id="rsChips"></div>
      </div>
      <div class="step-act">
        <button class="btn" id="bOpen"><svg class="ic"><use href="#i-folder"/></svg><span data-t="Dossier|Folder"></span></button>
        <button class="btn danger" id="bRestore"><svg class="ic"><use href="#i-undo"/></svg><span data-t="Restaurer|Restore"></span></button>
      </div>
    </section>
  </div>

  <details class="log" id="logBox">
    <summary><svg class="ic"><use href="#i-chev"/></svg><span data-t="Journal détaillé|Detailed log"></span><button class="btn ghost" id="bCopy" data-t="Copier|Copy"></button></summary>
    <pre id="log"></pre>
  </details>
</div></main>

<footer><span data-t="TBBR n'est pas un firmware officiel M-VAVE. Garde ta sauvegarde en lieu sûr.|TBBR is not an official M-VAVE firmware. Keep your backup somewhere safe."></span><span class="spacer"></span><span id="ver"></span></footer>
<div class="toasts" id="toasts"></div>
<div class="drop" id="drop"></div>
<input type="file" id="fwFile" accept=".tbbr" hidden>

<script>
'use strict';
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const $ = s => document.querySelector(s);
let S = null, lang = 'fr', logN = 0, lastBusy = false, pollT = 0;
const T = (fr, en) => lang === 'en' ? en : fr;
const tt = s => { const [fr, en] = s.split('|'); return T(fr, en ?? fr); };

const PH = {
  uboot: ['Mode mise à jour', 'Update mode'], read: ['Lecture de la flash', 'Reading flash'], build: ['Préparation', 'Preparing'],
  write: ['Écriture', 'Writing'], reboot: ['Redémarrage', 'Restart'], check: ['Vérification', 'Check'],
};
const TASK = {
  backup: ['Sauvegarde de la flash', 'Flash backup'], install: ['Installation du firmware TBBR', 'Installing the TBBR firmware'],
  update: ['Mise à jour du firmware', 'Firmware update'], restore: ['Restauration du firmware d\'origine', 'Restoring the original firmware'],
};

async function api(path, body) {
  const r = await fetch('/api/' + path, { method: body === undefined ? 'GET' : 'POST', headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
function toast(msg, err) {
  const el = document.createElement('div'); el.className = 'toast' + (err ? ' err' : ''); el.textContent = msg;
  $('#toasts').append(el); setTimeout(() => el.remove(), 3500);
}
function confirmBox({ title, html, ok, danger, warn }) {
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal"><div class="modal-h${warn ? ' w' : ''}"><svg class="ic"><use href="#${warn ? 'i-warn' : 'i-chip'}"/></svg><h3></h3></div><div class="modal-b"></div><div class="modal-f"><button class="btn ghost" data-r="0"></button><button class="btn ${danger ? 'danger' : 'primary'}" data-r="1"></button></div></div>`;
    bg.querySelector('h3').textContent = title; bg.querySelector('.modal-b').innerHTML = html;
    bg.querySelector('[data-r="0"]').textContent = T('Annuler', 'Cancel'); bg.querySelector('[data-r="1"]').textContent = ok;
    const done = v => { bg.remove(); document.removeEventListener('keydown', key); res(v); };
    const key = e => { if (e.key === 'Escape') done(false); };
    bg.addEventListener('click', e => { if (e.target === bg) done(false); const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r === '1'); });
    document.addEventListener('keydown', key);
    document.body.append(bg); bg.querySelector('[data-r="1"]').focus();
  });
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fwShort = s => (s || '').replace(/^TBBR fw\d+\s*/, 'v');

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = tt(el.dataset.t); });
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  if (S) render();
}

function render() {
  const d = S.device || {}, busy = S.busy, e = S.embedded || {};
  /* pédale */
  const DV = {
    search: ['search', T('Recherche de la pédale…', 'Looking for the pedal…'), T('Branche la pédale en USB (directement, sans hub) et allume-la.', 'Plug the pedal in by USB (directly, no hub) and power it on.')],
    none: ['bad', T('Pédale non détectée', 'Pedal not detected'), T('Branche l\'USB, allume la pédale, puis « Détecter ». Ferme l\'app TBBR et M-UPGRADE s\'ils sont ouverts.', 'Connect USB, power the pedal on, then "Detect". Close the TBBR app and M-UPGRADE if they are open.')],
    tbbr: ['ok', T('BlackBox TBBR connectée', 'BlackBox TBBR connected'), T('Firmware TBBR en marche. Le mode mise à jour sera activé automatiquement.', 'TBBR firmware running. Update mode will be enabled automatically.')],
    mvave: ['acc', T('BlackBox M-VAVE connectée', 'BlackBox M-VAVE connected'), T('Firmware M-VAVE d\'origine. Fais d\'abord la sauvegarde, puis installe TBBR.', 'Original M-VAVE firmware. Back up first, then install TBBR.')],
    uboot: ['acc', T('Pédale en mode mise à jour', 'Pedal in update mode'), T('Mode UBOOT : prête pour sauvegarde, installation ou restauration.', 'UBOOT mode: ready to back up, install or restore.')],
  }[d.kind || 'search'];
  if (d.needV19) { DV[0] = 'bad'; DV[1] = T('BlackBox M-VAVE : version non prise en charge', 'BlackBox M-VAVE: unsupported version'); DV[2] = T('Installe d\'abord le firmware officiel V19 avec M-UPGRADE, puis reviens ici. Voir la documentation (bouton ci-dessous).', 'First install the official V19 firmware with M-UPGRADE, then come back. See the documentation (button below).'); }
  $('#devDot').className = 'dot ' + DV[0]; $('#devTitle').textContent = DV[1]; $('#devSub').textContent = DV[2];
  const chips = [];
  if (d.fw) chips.push(`<span class="chip">${T('Installé', 'Installed')} <b>${esc(d.fw)}</b></span>`);
  if (e.fw) chips.push(`<span class="chip">${e.pkg ? T('Paquet', 'Package') : T('Inclus', 'Bundled')} <b>${esc(e.fw)}</b></span>`);
  if (S.update === 'available') chips.push(`<span class="chip acc">${T('Mise à jour disponible', 'Update available')} · ${esc(fwShort(d.fw))} → ${esc(fwShort(e.fw))}</span>`);
  else if (S.update === 'current') chips.push(`<span class="chip ok">${T('À jour', 'Up to date')}</span>`);
  else if (S.update === 'newer') chips.push(`<span class="chip warn">${T('Pédale plus récente que l\'installateur', 'Pedal newer than this installer')}</span>`);
  if (d.needV19) chips.push(`<a class="chip warn" href="https://mystery2312.github.io/tbbr/doc.html#v19" target="_blank" style="text-decoration:none">${T('Comment installer la V19', 'How to install V19')} →</a>`);
  if (d.battery != null) chips.push(`<span class="chip">${T('Batterie', 'Battery')} <b>${d.battery} %</b></span>`);
  $('#devChips').innerHTML = chips.join('');
  /* pédale : touches FX..CAB en chenillard pendant une opération, écran allumé si la pédale répond */
  const ledC = { ok: '#3ddc84', acc: '#19d3ff', bad: '#ff4d4d', search: '#ffb020' }[DV[0]];
  const present0 = d.kind === 'tbbr' || d.kind === 'uboot' || d.kind === 'mvave';
  const step = Math.floor(Date.now() / 140) % 6;
  document.querySelectorAll('#keys g').forEach((g, i) => {
    const lit = busy && i > 0 && (i - 1) === step;
    g.querySelector('rect.kb').setAttribute('stroke', lit ? '#19d3ff' : 'none');
    g.querySelector('text').setAttribute('fill', lit ? '#19d3ff' : '#d7dbe0');
  });
  document.querySelectorAll('.led').forEach(l => { l.setAttribute('fill', present0 ? ledC : '#2a2f37'); l.style.filter = present0 ? `drop-shadow(0 0 1.5px ${ledC})` : ''; });
  $('#scr').setAttribute('fill', present0 ? '#05080b' : '#0b0d10');
  $('#scrLogo').setAttribute('opacity', d.kind === 'tbbr' ? '1' : d.kind === 'mvave' || d.kind === 'uboot' ? '.35' : '0');

  /* sauvegarde */
  const b = S.backup || {};
  $('#bkPath').textContent = b.dir || T('Aucune sauvegarde sélectionnée', 'No backup selected');
  const bc = [];
  if (b.ok) {
    bc.push(`<span class="chip ok"><svg class="ic"><use href="#i-check"/></svg>${T('Vérifiée', 'Verified')}</span>`);
    if (b.kind) bc.push(`<span class="chip">${esc({ tbbr: 'TBBR', mvave: 'M-VAVE', unknown: T('inconnu', 'unknown') }[b.kind] || b.kind)}</span>`);
    if (b.date) bc.push(`<span class="chip">${esc(b.date)}</span>`);
    if (b.sha) bc.push(`<span class="chip">SHA <b>${esc(b.sha.slice(0, 8))}</b></span>`);
  } else if (b.dir) bc.push(`<span class="chip bad">${esc(b.msg || T('Sauvegarde invalide', 'Invalid backup'))}</span>`);
  else bc.push(`<span class="chip warn">${T('À faire avant l\'installation', 'Required before installing')}</span>`);
  $('#bkChips').innerHTML = bc.join('');
  $('#rsChips').innerHTML = !b.ok ? '' : b.kind === 'mvave'
    ? `<span class="chip ok"><svg class="ic"><use href="#i-check"/></svg>${T('Sauvegarde M-VAVE d\'origine', 'Original M-VAVE backup')}</span>`
    : `<span class="chip warn"><svg class="ic"><use href="#i-warn"/></svg>${T('Cette sauvegarde contient TBBR, pas M-VAVE', 'This backup holds TBBR, not M-VAVE')}</span>`;

  /* installer / mettre à jour */
  const upd = d.kind === 'tbbr';
  $('#instHead').textContent = upd ? T('Mettre à jour', 'Update') : T('Installer TBBR', 'Install TBBR');
  $('#instBtn').textContent = upd ? (S.update === 'current' ? T('Réinstaller', 'Reinstall') + ' ' + fwShort(e.fw) : T('Mettre à jour vers', 'Update to') + ' ' + fwShort(e.fw)) : T('Installer', 'Install') + ' ' + fwShort(e.fw);
  $('#instText').textContent = e.pkg
    ? T('Écrit le firmware du paquet chargé (vérifié par SHA-256).', 'Writes the firmware from the loaded package (SHA-256 verified).')
    : upd ? T('Écrit le firmware inclus dans cet installateur. Tes réglages restent dans la pédale.', 'Writes the firmware bundled with this installer. Your settings stay in the pedal.')
    : T('Le firmware TBBR est inclus : aucun fichier à chercher. L\'image est construite depuis TA sauvegarde.', 'The TBBR firmware is bundled: nothing to look for. The image is built from YOUR backup.');

  const present = d.kind && d.kind !== 'none' && d.kind !== 'search';
  $('#bBackup').disabled = busy || !present || !!d.needV19;
  $('#bInstall').disabled = busy || !present || !b.ok || !!d.needV19;
  $('#bRestore').disabled = busy || !present || !b.ok;
  $('#bChooseBk').disabled = busy; $('#bDetect').disabled = busy; $('#bOpen').disabled = !b.dir;
  document.querySelectorAll('#lang button').forEach(x => x.disabled = busy);
  $('#busyWarn').classList.toggle('on', !!busy);
  $('#busyTxt').textContent = S.task && S.task.id === 'backup'
    ? T('Lecture en cours : n\'éteins pas la pédale et ne débranche pas l\'USB.', 'Reading in progress: do not power the pedal off or unplug USB.')
    : T('Écriture en cours : n\'éteins pas la pédale, ne débranche pas l\'USB, ne ferme pas l\'installateur.', 'Writing in progress: do not power the pedal off, unplug USB or close the installer.');

  /* progression */
  const t = S.task;
  $('#prog').classList.toggle('on', !!t);
  if (t) {
    $('#progTitle').textContent = T(...(TASK[t.id] || [t.id, t.id]));
    const finished = t.ok === true || t.ok === false;
    const bar = $('#bar'); bar.className = 'bar' + (t.pct == null && !finished ? ' indet' : '') + (t.ok === true ? ' ok' : t.ok === false ? ' bad' : '');
    $('#barI').style.width = (t.ok === true ? 100 : (t.pct ?? 0)) + '%';
    $('#pct').textContent = t.ok === true ? '100 %' : t.pct != null ? Math.floor(t.pct) + ' %' : '';
    const ci = t.phases.indexOf(t.phase);
    $('#phases').innerHTML = t.phases.map((p, i) => {
      const cls = t.ok === true || i < ci ? 'done' : i === ci ? (t.ok === false ? 'fail' : 'cur') : '';
      return `<span class="ph ${cls}"><span class="d"></span>${esc(T(...(PH[p] || [p, p])))}</span>`;
    }).join('');
    $('#progLine').textContent = finished ? '' : (t.line || '');
    const r = $('#result');
    r.className = 'result' + (t.ok === true ? ' ok' : t.ok === false ? ' bad' : '');
    r.querySelector('use').setAttribute('href', t.ok === false ? '#i-x' : '#i-check');
    $('#resultTxt').textContent = t.msg || '';
    $('#bDismiss').style.display = finished ? '' : 'none';
  }
  $('#ver').textContent = (S.app || '') + (e.builtin ? ' · ' + T('inclus', 'bundled') + ' ' + e.builtin : '');
  const pk = $('#pkgBox');
  pk.classList.toggle('loaded', !!e.pkg);
  pk.innerHTML = e.pkg
    ? `<svg class="ic"><use href="#i-chip"/></svg><span>${T('Paquet', 'Package')} <b>${esc(e.pkg.name)}</b> · ${esc(e.pkg.fw)}</span><button class="btn ghost" id="bClearPkg" style="height:26px;font-size:11px">${T('Retirer', 'Remove')}</button>`
    : `<svg class="ic"><use href="#i-save"/></svg><span>${T('Nouvelle version ? Glisse le fichier <b>.tbbr</b> ici ou clique.', 'New version? Drop the <b>.tbbr</b> file here or click.')}</span>`;
  const cb = $('#bClearPkg'); if (cb) cb.onclick = ev => { ev.stopPropagation(); act('clear_fw'); };
}

async function poll() {
  clearTimeout(pollT);
  try {
    const st = await api('state?since=' + logN);
    if (st.log && st.log.length) {
      const pre = $('#log'), atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 8;
      pre.textContent += st.log.join(''); logN = st.logN;
      if (pre.textContent.length > 200000) pre.textContent = pre.textContent.slice(-150000);
      if (atEnd) pre.scrollTop = pre.scrollHeight;
    }
    if (st.lang && st.lang !== lang) { lang = st.lang; S = st; applyLang(); } else S = st;
    if (lastBusy && !st.busy && st.task && st.task.ok === false) $('#logBox').open = true;
    lastBusy = st.busy;
    render();
  } catch (e) { /* serveur arrêté : la fenêtre peut être fermée */ }
  pollT = setTimeout(poll, S && S.busy ? 300 : 1200);
}
async function act(path, body) {
  try { const r = await api(path, body || {}); if (r && r.error) toast(r.error, true); poll(); return r; }
  catch (e) { toast(String(e.message || e), true); }
}

$('#lang').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !S?.busy) { lang = b.dataset.l; applyLang(); act('lang', { lang }); } });
$('#bDetect').onclick = () => act('detect');
$('#bChooseBk').onclick = () => act('choose_backup');
$('#bOpen').onclick = () => act('open_folder');
$('#bDismiss').onclick = () => act('dismiss');
$('#bCopy').onclick = e => { e.preventDefault(); navigator.clipboard.writeText($('#log').textContent).then(() => toast(T('Journal copié', 'Log copied'))); };
$('#bBackup').onclick = async () => {
  const dest = S.backupParent || '';
  if (await confirmBox({ title: T('Sauvegarder la flash', 'Back up the flash'), ok: T('Sauvegarder', 'Back up'),
    html: `<p>${T('La sauvegarde sera enregistrée dans un nouveau dossier de :', 'The backup will be saved in a new folder inside:')}</p><div class="path">${esc(dest)}</div><p>${T('Lecture d\'environ 2 minutes. Rien n\'est écrit sur la pédale.', 'Takes about 2 minutes. Nothing is written to the pedal.')}</p>` }))
    act('backup');
};
$('#bInstall').onclick = async () => {
  const upd = S.device?.kind === 'tbbr', e = S.embedded || {};
  if (await confirmBox({ title: upd ? T('Mettre à jour le firmware', 'Update the firmware') : T('Installer le firmware TBBR', 'Install the TBBR firmware'),
    ok: upd ? T('Mettre à jour', 'Update') : T('Installer', 'Install'),
    html: `<p>${T('Firmware écrit :', 'Firmware written:')} <b style="color:var(--tx)">${esc(e.fw)}</b>${S.device?.fw ? ` (${T('actuel', 'current')} : ${esc(S.device.fw)})` : ''}</p><p>${T('Sauvegarde de référence :', 'Reference backup:')}</p><div class="path">${esc(S.backup?.dir)}</div><p>${T('Environ 1 minute. Ne débranche pas l\'USB pendant l\'écriture.', 'About 1 minute. Do not unplug USB while writing.')}</p>` }))
    act('install');
};
$('#bRestore').onclick = async () => {
  if (await confirmBox({ title: T('Restaurer le firmware d\'origine', 'Restore the original firmware'), ok: T('Restaurer', 'Restore'), danger: true, warn: true,
    html: `<p>${T('Toute la flash (hors bootloader) va être réécrite avec :', 'The whole flash (bootloader excluded) will be rewritten with:')}</p><div class="path">${esc(S.backup?.dir)}</div><p>${T('Les presets, IR et captures NAM du firmware TBBR seront remplacés par ceux de la sauvegarde.', 'TBBR presets, IRs and NAM captures will be replaced by the backup\'s.')}</p>` }))
    act('restore');
};
/* paquet de mise à jour .tbbr : bouton ou glisser-déposer */
async function uploadFw(f) {
  if (!f || S?.busy) return;
  if (!/\.tbbr$/i.test(f.name)) { toast(T('Choisis un fichier .tbbr', 'Choose a .tbbr file'), true); return; }
  try {
    const r = await fetch('/api/upload_fw?name=' + encodeURIComponent(f.name), { method: 'POST', headers: { 'X-Token': TOKEN, 'Content-Type': 'application/octet-stream' }, body: await f.arrayBuffer() });
    const j = await r.json();
    if (j.error) toast(j.error, true); else toast(T('Paquet vérifié : ', 'Package verified: ') + j.fw);
  } catch (e) { toast(String(e.message || e), true); }
  poll();
}
$('#pkgBox').addEventListener('click', () => { if (!S?.embedded?.pkg && !S?.busy) $('#fwFile').click(); });
$('#fwFile').addEventListener('change', e => { uploadFw(e.target.files[0]); e.target.value = ''; });
let dragN = 0;
window.addEventListener('dragenter', e => { e.preventDefault(); if (++dragN === 1 && !S?.busy) { $('#drop').textContent = T('Dépose le fichier .tbbr', 'Drop the .tbbr file'); $('#drop').classList.add('on'); } });
window.addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('#drop').classList.remove('on'); } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('#drop').classList.remove('on'); uploadFw(e.dataTransfer.files[0]); });
window.addEventListener('beforeunload', e => { if (S && S.busy) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('contextmenu', e => { if (!e.target.closest('pre, .path, .result span')) e.preventDefault(); });
setInterval(() => { if (S && S.busy) render(); }, 160);
/* rangée de 7 touches de la façade (12 x 5,6 mm, de x = 7 à 106 mm) */
$('#keys').innerHTML = ['HOME', 'FX', 'AMP', 'MOD', 'DLY', 'REV', 'CAB'].map((k, i) => {
  const x = 7 + i * 14.5;
  return `<g><rect x="${x}" y="50.5" width="12" height="5.6" rx="1" fill="#0b0c0e"/><rect class="kb" x="${x}" y="50" width="12" height="5.6" rx="1" fill="url(#gKey)" stroke-width=".3"/><text x="${x + 6}" y="53.5" fill="#d7dbe0">${k}</text></g>`;
}).join('');
applyLang(); poll();
</script>
</body>
</html>
