<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TBBR — The Big Black Rig</title>
<meta name="description" content="Open firmware for the M-VAVE BlackBox: native NAM A2 Lite, cab IRs, modeled amps and pedals, editor and installer.">
<link rel="icon" href="sim/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08090b; --panel: #121418; --panel2: #171a1f; --panel3: #1d2127; --line: #22262d; --line2: #2d323a;
  --tx: #eceef1; --tx2: #9ba3ad; --tx3: #5f6772; --acc: #19d3ff; --acc2: #0aa6cc; --ok: #3ddc84; --warn: #ffb020;
  --mono: 'JetBrains Mono', Consolas, monospace; color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: radial-gradient(900px 480px at 78% -5%, rgba(25, 211, 255, .10), transparent 60%), radial-gradient(700px 420px at 8% 30%, rgba(176, 108, 255, .055), transparent 65%), var(--bg); color: var(--tx); font: 15px/1.55 Inter, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--acc); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { width: min(1080px, 100%); margin: 0 auto; padding: 0 16px; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

header { position: sticky; top: 0; z-index: 10; background: linear-gradient(#14171bee, #0e1013ee); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
.top { height: 56px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 9px; }
.brand svg { width: 28px; height: 28px; fill: none; stroke: var(--acc); stroke-width: 2; }
.brand span { font-weight: 800; letter-spacing: .14em; font-size: 12px; color: var(--tx2); }
.brand b { color: var(--tx); }
nav { display: flex; gap: 18px; margin-left: auto; font-size: 13px; font-weight: 600; }
nav a { color: var(--tx2); }
nav a:hover { color: var(--tx); text-decoration: none; }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: #0a0b0e; border: 1px solid var(--line2); }
.seg button { font: 700 11.5px Inter, sans-serif; height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: var(--tx2); cursor: pointer; }
.seg button.on { background: var(--panel3); color: var(--acc); box-shadow: 0 0 0 1px var(--line2); }
@media (max-width: 720px) { nav { display: none; } .seg { margin-left: auto; } }

.hero { padding: 64px 0 48px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; align-items: center; position: relative; }
.hero > * { position: relative; z-index: 1; }
.hero-glow { position: absolute; z-index: 0; border-radius: 50%; filter: blur(70px); pointer-events: none; opacity: .5; }
.hero-glow.g1 { width: 320px; height: 260px; left: -80px; top: 40px; background: rgba(25, 211, 255, .16); animation: drift 14s ease-in-out infinite; }
.hero-glow.g2 { width: 260px; height: 240px; right: 6%; bottom: 0; background: rgba(176, 108, 255, .11); animation: drift 18s ease-in-out infinite reverse; }
.hero-signal { position: absolute; z-index: 0; left: -18px; top: 24%; width: 64%; height: 150px; opacity: .38; pointer-events: none; }
.hero-signal path { fill: none; stroke: var(--acc); stroke-width: 1.4; }
.hero-signal .dash { stroke-dasharray: 4 9; animation: dash 7s linear infinite; opacity: .65; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; padding-top: 36px; } .hero .pedal { width: min(380px, 100%); margin: 0 auto; } .hero-signal { width: 100%; left: 0; top: 18%; } }
.kicker { font: 700 11px var(--mono); letter-spacing: .16em; color: var(--acc); text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.kicker::before { content: ""; width: 26px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--acc), transparent); }
h1 { font-size: clamp(34px, 5.2vw, 54px); line-height: 1.05; font-weight: 800; letter-spacing: -.02em; margin: 12px 0 16px; }
h1 em { font-style: normal; color: transparent; background: linear-gradient(100deg, var(--acc) 10%, #9cefff 48%, var(--acc) 85%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; animation: shine 7s linear infinite; }
.lead { color: var(--tx2); font-size: 17px; max-width: 560px; }
.cta { display: flex; gap: 10px; flex-wrap: wrap; margin: 26px 0 12px; }
.btn { height: 44px; padding: 0 18px; display: inline-flex; align-items: center; gap: 9px; border-radius: 11px; background: var(--panel3); border: 1px solid var(--line2); color: var(--tx); font-weight: 700; font-size: 14px; white-space: nowrap; transition: transform .18s, background .18s, border-color .18s, box-shadow .18s; }
.btn:hover { text-decoration: none; background: #252a31; border-color: #3a414b; transform: translateY(-1px); }
.btn.primary { background: linear-gradient(180deg, #38dcff, var(--acc)); border-color: var(--acc); color: #001a22; box-shadow: 0 8px 28px rgba(25, 211, 255, .16); }
.btn.primary:hover { filter: brightness(1.08); background: linear-gradient(180deg, #38dcff, var(--acc)); box-shadow: 0 10px 34px rgba(25, 211, 255, .28); }
.meta { color: var(--tx3); font-size: 12.5px; }
.meta b { color: var(--tx2); }
.pedal { position: relative; isolation: isolate; }
.pedal::before { content: ""; position: absolute; inset: 8% 0 12%; z-index: -1; border-radius: 50%; background: radial-gradient(closest-side, rgba(25, 211, 255, .18), transparent 72%); filter: blur(18px); }
.pedal iframe { display: block; width: 100%; aspect-ratio: 117 / 116; border: 0; background: transparent; filter: drop-shadow(0 24px 40px rgba(0, 0, 0, .7)); }
.sim-cap { max-width: 420px; margin-left: auto; margin-right: auto; }
@keyframes drift { 50% { transform: translate3d(16px, -14px, 0) scale(1.08); } }
@keyframes shine { to { background-position: -220% 0; } }
@keyframes dash { to { stroke-dashoffset: -160; } }
.sim-cap { margin-top: 10px; display: flex; gap: 8px; align-items: flex-start; justify-content: center; color: var(--tx3); font-size: 12px; text-align: center; }
.live { width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); flex: none; animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .3; } }

section { padding: 52px 0; border-top: 1px solid var(--line); position: relative; }
h2 { font-size: 24px; font-weight: 800; letter-spacing: -.01em; margin-bottom: 8px; }
h2::before { content: ""; display: block; width: 26px; height: 2px; border-radius: 2px; margin-bottom: 12px; background: linear-gradient(90deg, var(--acc), transparent); }
.sub { color: var(--tx2); margin-bottom: 24px; max-width: 700px; }
.grid { display: grid; gap: 16px; }
.grid.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 980px) { .grid.g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 820px) { .grid.g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .grid.g2, .grid.g3, .grid.g4 { grid-template-columns: 1fr; } }
.card { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; min-width: 0; position: relative; overflow: hidden; transition: transform .2s, border-color .2s, box-shadow .2s; }
.card::after { content: ""; position: absolute; inset: 0 0 auto; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .08), transparent); pointer-events: none; }
.card:hover { transform: translateY(-3px); border-color: #343b46; box-shadow: 0 16px 36px rgba(0, 0, 0, .32); }
.card h3 { font-size: 15px; font-weight: 700; margin: 0 0 6px; }
.card p { color: var(--tx2); font-size: 13.5px; flex: 1; }
.card .ic { width: 22px; height: 22px; color: var(--acc); }
.illus { position: relative; height: 116px; margin: -18px -18px 16px; border-bottom: 1px solid var(--line); border-radius: 14px 14px 0 0; overflow: hidden; background: radial-gradient(120% 130% at 82% 0%, rgba(25, 211, 255, .16), transparent 55%), linear-gradient(180deg, #0b0e12, #11151a); }
.illus svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.illus .glow { filter: drop-shadow(0 0 6px currentColor); }
.illus .float { animation: floaty 5.5s ease-in-out infinite; }
.illus .float2 { animation: floaty 6.5s ease-in-out infinite reverse; }
.illus .blink { animation: blink 2.4s ease-in-out infinite; }
.illus .dash { stroke-dasharray: 3 6; animation: dash 6s linear infinite; }
.illus text { font: 700 9px var(--mono); fill: var(--tx3); letter-spacing: .08em; }
.card-ico { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; margin-bottom: 13px; color: var(--acc); background: radial-gradient(circle at 30% 20%, rgba(25, 211, 255, .16), rgba(25, 211, 255, .04)); border: 1px solid rgba(25, 211, 255, .25); }
.card-ico .ic { width: 22px; height: 22px; }
.stat { display: flex; align-items: baseline; gap: 7px; margin-bottom: 12px; }
.stat .big { font: 800 38px/1 var(--mono); letter-spacing: -.06em; color: var(--tx); }
.stat .unit { font: 700 12px var(--mono); color: var(--acc); letter-spacing: .08em; }
.stat .mini { margin-left: auto; align-self: center; font: 700 10px var(--mono); color: var(--tx3); letter-spacing: .1em; text-transform: uppercase; }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 26px; margin: -2px 0 13px; opacity: .8; }
.spark i { flex: 1; height: calc(var(--h) * 100%); border-radius: 2px 2px 0 0; background: linear-gradient(180deg, var(--acc), rgba(25, 211, 255, .12)); animation: eq 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * -.17s); }
.steps { counter-reset: s; display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 620px) { .steps { grid-template-columns: 1fr; } }
.steps .card { position: relative; padding-left: 62px; }
.steps .card::before { counter-increment: s; content: counter(s); position: absolute; left: 18px; top: 18px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--acc); color: #001a22; font-weight: 800; font-size: 13px; box-shadow: 0 0 18px rgba(25, 211, 255, .28); }
.steps .card h3 { margin-top: 2px; }
.step-mark { position: absolute; right: 10px; top: 8px; width: 92px; height: 92px; color: var(--acc); opacity: .09; pointer-events: none; fill: none; stroke: currentColor; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
@keyframes floaty { 50% { transform: translateY(-7px); } }
@keyframes eq { 50% { transform: scaleY(.35); transform-origin: bottom; opacity: .55; } }
.note { margin-top: 16px; display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; background: rgba(255, 176, 32, .07); border: 1px solid rgba(255, 176, 32, .35); color: #ffd08a; font-size: 13px; }
.note .ic { color: var(--warn); }
details.faq { margin: 8px 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); transition: border-color .2s, background .2s; }
details.faq:hover { border-color: #343b46; background: var(--panel2); }
details.faq[open] { border-color: rgba(25, 211, 255, .35); }
details.faq summary { cursor: pointer; font-weight: 700; color: var(--tx); }
details.faq summary::marker { color: var(--acc); }
details.faq p { margin-top: 8px; color: var(--tx2); font-size: 14px; }
.changelog { list-style: none; margin: 10px 0 0; padding: 0; }
.changelog li { padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--tx2); font-size: 14px; }
.changelog b { display: inline-block; min-width: 64px; color: var(--acc); font: 700 12.5px var(--mono); }
.exp { margin: 0 0 8px; display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: 14px; background: rgba(255, 176, 32, .07); border: 1px solid rgba(255, 176, 32, .45); }
.exp .ic { width: 24px; height: 24px; color: var(--warn); margin-top: 2px; }
.exp b { display: block; color: #ffd08a; font-size: 15px; margin-bottom: 4px; }
.exp p { color: var(--tx2); font-size: 13.5px; }
code { font: 12.5px var(--mono); background: #0a0b0e; border: 1px solid var(--line2); border-radius: 6px; padding: 1px 6px; color: var(--tx); }
.final { padding: 52px 0; border-top: 1px solid var(--line); background: radial-gradient(700px 220px at 82% 50%, rgba(25, 211, 255, .10), transparent 70%); }
.final .wrap { display: flex; align-items: center; justify-content: space-between; gap: 28px; flex-wrap: wrap; }
.final h2 { margin-bottom: 4px; }
.final .sub { margin-bottom: 0; }
footer { border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--tx3); font-size: 12.5px; }
footer p + p { margin-top: 6px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
</style>
</head>

      <div class="kicker" data-t="Firmware libre · M-VAVE BlackBox|Open firmware · M-VAVE BlackBox"></div>

      <p class="lead" data-t="TBBR remplace le firmware de la M-VAVE BlackBox : captures NAM jouées nativement, IR de baffle, amplis et pédales modélisés, 80 presets dans la pédale, et un éditeur clair sur PC Windows et Android.|TBBR replaces the M-VAVE BlackBox firmware: NAM captures played natively, cab IRs, modeled amps and pedals, 80 presets stored in the pedal, and a clean editor on Windows PC and Android."></p>

  <div class="exp"><svg class="ic"><use href="#i-warn"/></svg><div><b data-t="Projet expérimental|Experimental project"></b><p data-t="TBBR est un projet indépendant et expérimental. La procédure d'installation est relativement maîtrisée : sauvegarde complète vérifiée avant toute écriture, bootloader jamais modifié, chaque secteur relu, retour possible au firmware M-VAVE. Mais tu installes et utilises TBBR à tes risques et périls : ni les auteurs ni M-VAVE ne peuvent être tenus responsables d'un dommage à ta pédale ou d'une perte de données.|TBBR is an independent, experimental project. The installation procedure is reasonably under control: full verified backup before any write, bootloader never modified, every sector read back, a way back to the M-VAVE firmware. But you install and use TBBR at your own risk: neither the authors nor M-VAVE can be held liable for any damage to your pedal or loss of data."></p></div></div>

    <p class="sub" data-t="Tout tourne dans la pédale : pas besoin d'ordinateur pour jouer.|Everything runs inside the pedal: no computer needed to play."></p>

          <path d="M18 92h324M18 28h324" stroke="#22262d" stroke-width="1"/>
          <path d="M20 72C40 72 46 44 66 44s26 40 46 40 26-50 48-50 30 44 54 44 26-26 48-26 30 18 54 18 22-10 28-10" fill="none" stroke="#19d3ff" stroke-width="2" class="glow"/>
          <path d="M20 72C40 72 46 44 66 44s26 40 46 40 26-50 48-50 30 44 54 44 26-26 48-26 30 18 54 18 22-10 28-10" fill="none" stroke="#9cefff" stroke-width="1" class="dash" opacity=".55"/>

          <g fill="#19d3ff"><circle cx="112" cy="84" r="2" class="blink"/><circle cx="262" cy="52" r="2" class="blink" style="animation-delay:.7s"/></g>
          <text x="18" y="16">NAM · A2 LITE</text><text x="292" y="16">48 kHz</text>
        </svg></div>
        <h3 data-t="NAM A2 Lite natif|Native NAM A2 Lite"></h3><p data-t="Charge tes captures .nam telles quelles. Le réseau tourne en temps réel sur les deux cœurs de la puce.|Load your .nam captures as they are. The network runs in real time on both cores of the chip."></p>
      </div>
      <div class="card">
        <div class="illus" data-no-i18n><svg viewBox="0 0 360 116" aria-hidden="true">
          <rect x="20" y="24" width="104" height="72" rx="8" fill="#151210" stroke="#c98a55" stroke-opacity=".7"/>
          <g fill="#0b0e12" stroke="#c98a55" stroke-width="1.2">
            <circle cx="48" cy="48" r="11"/><circle cx="96" cy="48" r="11"/><circle cx="48" cy="74" r="11"/><circle cx="96" cy="74" r="11"/>

  <section id="install">

    <p class="sub" data-h="Environ 5 minutes, sur un PC Windows avec un câble USB. Détails : <a href='doc.html#install'>documentation</a>.|About 5 minutes, on a Windows PC with a USB cable. Details: <a href='doc.html#install'>documentation</a>."></p>
    <div class="steps">
      <div class="card"><svg class="step-mark" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-warn"/></svg><h3 data-t="Vérifie la version M-VAVE|Check the M-VAVE version"></h3><p data-h="L'installation part du firmware officiel <b>V19</b>. Si ta pédale a une version plus récente (022, 023…), installe d'abord la V19 avec M-UPGRADE : <a href='doc.html#v19'>procédure</a>.|Installation starts from the official <b>V19</b> firmware. If your pedal runs a newer version (022, 023…), first install V19 with M-UPGRADE: <a href='doc.html#v19'>how to</a>."></p></div>
      <div class="card"><svg class="step-mark" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-down"/></svg><h3 data-t="Télécharge l'app|Download the app"></h3><p data-h="<a href='https://github.com/mystery2312/tbbr/releases/latest/download/BlackBox_TBBR_App.exe'>BlackBox_TBBR_App.exe</a> : un seul fichier, rien à installer. Ferme M-UPGRADE s'il est ouvert.|<a href='https://github.com/mystery2312/tbbr/releases/latest/download/BlackBox_TBBR_App.exe'>BlackBox_TBBR_App.exe</a>: a single file, nothing to install. Close M-UPGRADE if it is open."></p></div>
      <div class="card"><svg class="step-mark" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-save"/></svg><h3 data-t="Sauvegarde ta pédale|Back up your pedal"></h3><p data-t="Branche la pédale en USB (sans hub), puis dans Appareil → Ouvrir l'installateur → Sauvegarder. C'est ce qui permet de revenir au firmware M-VAVE.|Connect the pedal by USB (no hub), then Device → Open the installer → Back up. This is what lets you go back to the M-VAVE firmware."></p></div>

  <section id="faq">
    <h2 data-t="Questions fréquentes|Frequently asked questions"></h2>
    <p class="sub" data-h="Les réponses courtes ; la documentation complète est dans <a href='doc.html'>doc.html</a>.|Short answers; the full documentation is in <a href='doc.html'>doc.html</a>."></p>
    <details class="faq"><summary data-t="TBBR modifie-t-il le bootloader ?|Does TBBR modify the bootloader?"></summary><p data-t="Non. Le SPL/bootloader n'est jamais écrit. TBBR ne remplace que la zone application, et chaque secteur est relu après écriture.|No. The SPL/bootloader is never written. TBBR only replaces the application area, and every sector is read back after writing."></p></details>
    <details class="faq"><summary data-t="Puis-je revenir au firmware M-VAVE ?|Can I go back to the M-VAVE firmware?"></summary><p data-t="Oui, avec l'installateur et ta sauvegarde complète (Restaurer). Tu peux ensuite remettre la dernière version officielle avec M-UPGRADE.|Yes, with the installer and your full backup (Restore). You can then reinstall the latest official version with M-UPGRADE."></p></details>
    <details class="faq"><summary data-t="Les presets sont-ils conservés pendant une mise à jour ?|Are presets kept during an update?"></summary><p data-t="Oui. Une mise à jour ne réécrit que la zone application ; les presets, IR et captures NAM restent dans la pédale.|Yes. An update only rewrites the application area; presets, IRs and NAM captures stay in the pedal."></p></details>
    <details class="faq"><summary data-t="Faut-il l'ordinateur pour jouer ?|Do I need a computer to play?"></summary><p data-t="Non. Une fois TBBR installé, tous les effets, presets et scènes tournent dans la pédale. L'ordinateur sert à éditer et à mettre à jour.|No. Once TBBR is installed, all effects, presets and scenes run inside the pedal. The computer is only for editing and updating."></p></details>
    <details class="faq"><summary data-t="Quelles captures NAM sont acceptées ?|Which NAM captures are supported?"></summary><p data-t="Les fichiers .nam en architecture A2, joués par le sous-modèle Lite. Les autres architectures sont refusées avec la raison.|.nam files using the A2 architecture, played by the Lite sub-model. Other architectures are rejected with the reason."></p></details>
    <details class="faq"><summary data-t="L'app Android peut-elle flasher le firmware ?|Can the Android app flash the firmware?"></summary><p data-t="Non. Android édite la pédale en USB OTG, mais le flash du firmware demande un PC Windows et l'installateur.|No. Android edits the pedal over USB OTG, but firmware flashing requires a Windows PC and the installer."></p></details>
  </section>

<script>
'use strict';
let lang = 'en';
try { const s = localStorage.getItem('tbbr.lang'); if (s === 'fr' || s === 'en') lang = s; } catch (e) { /* stockage indisponible */ }
const META = {
  en: { title: 'TBBR — The Big Black Rig', desc: 'Open firmware for the M-VAVE BlackBox: native NAM A2 Lite, cab IRs, modeled amps and pedals, editor and installer.' },
  fr: { title: 'TBBR — The Big Black Rig', desc: 'Firmware libre pour la M-VAVE BlackBox : NAM A2 Lite natif, IR, amplis et pédales modélisés, éditeur et flasher.' }
};
function apply() {
  document.documentElement.lang = lang;
  const pick = v => { const p = v.split('|'); return lang === 'en' ? (p[1] ?? p[0]) : p[0]; };
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = pick(el.dataset.t); });
  document.querySelectorAll('[data-h]').forEach(el => { el.innerHTML = pick(el.dataset.h); });
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  const m = META[lang]; document.title = m.title;
  const d = document.querySelector('meta[name="description"]'); if (d) d.setAttribute('content', m.desc);
}
document.getElementById('lang').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; lang = b.dataset.l; try { localStorage.setItem('tbbr.lang', lang); } catch (x) { /* ignoré */ } apply(); const f = document.querySelector('.pedal iframe'); if (f) f.src = f.src; });
apply();
fetch('https://api.github.com/repos/mystery2312/tbbr/releases/latest').then(r => r.ok ? r.json() : null).then(j => {
  document.getElementById('ver').textContent = j && j.tag_name ? j.tag_name : '—';
}).catch(() => { document.getElementById('ver').textContent = '—'; });
