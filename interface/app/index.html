<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=1795372124">
</head>

<div id="app">
  <header class="topbar">
    <button class="icon-btn only-drawer" id="btnDrawer" title="Presets"><svg class="ic"><use href="#i-menu"/></svg></button>
    <button class="icon-btn only-tab tab-home" id="btnHome" title="Retour à la grille"><svg class="ic"><use href="#i-grid"/></svg></button>
    <div class="brand" title="The Big Black Rig">
      <svg viewBox="0 0 32 32" class="brand-mark"><rect x="2" y="7" width="28" height="18" rx="4"/><circle cx="10" cy="19" r="3"/><circle cx="22" cy="19" r="3"/><path d="M7 12h18"/></svg>
      <span class="brand-txt">BIG<b>BLACK</b>RIG</span>
    </div>

    <div class="preset-nav">
      <button class="icon-btn" id="prevPreset" title="Preset précédent (←)"><svg class="ic"><use href="#i-left"/></svg></button>
      <div class="preset-current">
        <span class="pc-num" id="pcNum">01A</span>
        <input class="pc-name" id="pcName" maxlength="20" spellcheck="false" aria-label="Nom du preset">
        <i class="dirty-dot" id="dirtyDot" title="Modifications non sauvées"></i>
      </div>
      <button class="icon-btn" id="nextPreset" title="Preset suivant (→)"><svg class="ic"><use href="#i-right"/></svg></button>
    </div>

    <nav class="views" id="viewTabs">
      <button data-view="grid" class="active" title="Grille"><svg class="ic"><use href="#i-grid"/></svg><span>Grille</span></button>
      <button data-view="foot" title="Footswitchs"><svg class="ic"><use href="#i-foot"/></svg><span>Contrôles</span></button>
      <button data-view="nam" title="Captures NAM"><svg class="ic"><use href="#i-nam"/></svg><span>NAM</span></button>
      <button data-view="ir" title="IR"><svg class="ic"><use href="#i-wave"/></svg><span>IR</span></button>
      <button data-view="global" title="Global"><svg class="ic"><use href="#i-sliders"/></svg><span>Global</span></button>
      <button data-view="device" title="Appareil"><svg class="ic"><use href="#i-chip"/></svg><span>Appareil</span></button>
    </nav>

    <div class="top-right">
      <button class="icon-btn lang-btn" id="langBtn" title="Langue / Language" data-no-i18n>FR</button>
      <div class="batt-pill" id="battPill" hidden title="Batterie de la pédale">
        <span class="batt-mini"><i id="battFill"></i></span><b id="battVal">—</b>
      </div>
      <div class="meters" title="Entrée / Sortie"><i id="mIn"></i><i id="mOut"></i></div>
      <div class="dsp-meter" title="Charge DSP du preset"><span>DSP</span><div class="bar"><i id="dspBar"></i></div><b id="dspVal">0%</b></div>
      <button class="icon-btn" id="btnUndo" title="Annuler (Ctrl+Z)"><svg class="ic"><use href="#i-undo"/></svg></button>
      <button class="icon-btn" id="btnRedo" title="Rétablir (Ctrl+Maj+Z)"><svg class="ic"><use href="#i-redo"/></svg></button>
      <button class="fs-chip only-tab" id="fsModeChip" title="Mode des footswitchs (toucher pour changer)">SCÈNE</button>
      <button class="icon-btn only-tab" id="btnLive" title="Mode Live"><svg class="ic"><use href="#i-play"/></svg></button>
      <button class="icon-btn" id="btnTuner" title="Accordeur (T)"><svg class="ic"><use href="#i-tuner"/></svg></button>
      <button class="btn primary" id="btnSave" title="Sauver sur la pédale (Ctrl+S)"><svg class="ic"><use href="#i-save"/></svg><span>Sauver</span></button>
      <button class="conn-pill" id="btnConnect" data-state="off"><i class="led"></i><span id="connLabel">Déconnecté</span></button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar" data-tab="presets">
    <div class="side-head">
      <div class="side-tabs" id="sideTabs">
        <button data-tab="presets" class="on"><svg class="ic"><use href="#i-save"/></svg>Presets</button>
        <button data-tab="blocks"><svg class="ic"><use href="#i-grid"/></svg>Blocs</button>
      </div>
      <div class="search"><svg class="ic"><use href="#i-search"/></svg><input id="presetSearch" placeholder="Rechercher un preset" spellcheck="false"></div>
    </div>
    <div class="preset-list" id="presetList"></div>
    <div class="lib" id="blockLib"></div>
    <div class="side-foot">
      <button class="icon-btn" data-pact="copy" title="Copier le preset"><svg class="ic"><use href="#i-copy"/></svg></button>
      <button class="icon-btn" data-pact="paste" title="Coller sur ce preset"><svg class="ic"><use href="#i-paste"/></svg></button>
      <button class="icon-btn" data-pact="init" title="Réinitialiser le preset"><svg class="ic"><use href="#i-reset"/></svg></button>
      <button class="icon-btn" data-pact="import" title="Importer (.json)"><svg class="ic"><use href="#i-up"/></svg></button>
      <button class="icon-btn" data-pact="export" title="Exporter (.json)"><svg class="ic"><use href="#i-down"/></svg></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="stage">
    <section class="view view-grid active" data-view="grid">
      <div class="grid-toolbar" id="gridToolbar"></div>
      <div class="chain-wrap"><div class="chain" id="chain"></div></div>
      <div class="editor" id="editor"></div>
    </section>
    <section class="view view-foot" data-view="foot" id="viewFoot"></section>
    <section class="view view-nam" data-view="nam" id="viewNam"></section>
    <section class="view view-ir" data-view="ir" id="viewIr"></section>
    <section class="view view-global" data-view="global" id="viewGlobal"></section>
    <section class="view view-device" data-view="device" id="viewDevice"></section>
  </main>

  <footer class="scenebar" id="scenebar"></footer>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>
<input type="file" id="filePick" hidden>
<input type="file" id="filePickMulti" hidden multiple>
<div class="rotate-hint"><svg class="ic"><use href="#i-rotate"/></svg><p>Tourne ton appareil en paysage</p></div>

<script src="js/data.js?v=1795547842"></script>
<script src="js/transport.js?v=1795543937"></script>
<script src="js/i18n.js?v=1795458056"></script>
<script src="js/app.js?v=1795554860"></script>
</body>
</html>
